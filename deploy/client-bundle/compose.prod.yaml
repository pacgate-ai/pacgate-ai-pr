# Pacgate-ai production compose — client AIPC deployment
#
# This stack runs: pacgate-api (metadata), deer-flow (research), Postgres, nginx.
# qm (co-working workspace) runs SEPARATELY via `qm up` from the qm-pacgate/
# deployment directory. See setup-qm.ps1 for qm bootstrap.

services:
  pacgate-db:
    image: postgres:16-alpine
    container_name: pacgate-db
    environment:
      POSTGRES_DB: pacgate
      POSTGRES_USER: pacgate
      POSTGRES_PASSWORD: ${PACGATE_DB_PASSWORD}
    volumes:
      - pacgate-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  pacgate-api:
    image: ghcr.io/jzkk720/pacgate-api:0.1.2
    container_name: pacgate-api
    depends_on: [pacgate-db]
    environment:
      DATABASE_URL: postgres://pacgate:${PACGATE_DB_PASSWORD}@pacgate-db:5432/pacgate
      DATA_DIR: /data/tenants
      PACGATE_JWT_SECRET: ${PACGATE_JWT_SECRET}
      PACGATE_DEFAULT_TENANT: ${PACGATE_TENANT_ID:-default-firm}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RUST_LOG: info
    volumes:
      - ./data:/data
    restart: unless-stopped

  deer-flow:
    image: ghcr.io/jzkk720/deer-flow-pacgate:0.1.0
    container_name: deer-flow
    depends_on: [pacgate-api, openviking, pacgate-mcp]
    environment:
      PACGATE_API_URL: http://pacgate-api:8080
      PACGATE_TENANT_ID: ${PACGATE_TENANT_ID:-default-firm}
      PACGATE_JWT_TOKEN: ${PACGATE_JWT_TOKEN}
      PACGATE_API_EMAIL: ${PACGATE_API_EMAIL}
      PACGATE_API_PASSWORD: ${PACGATE_API_PASSWORD}
      PACGATE_MATTER_ID: ${PACGATE_MATTER_ID}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEER_FLOW_EXTENSIONS_CONFIG_PATH: /app/deer-flow-extensions-config.json
      # Allow the browser (via the frontend proxy) to call auth routes. The
      # gateway rejects cross-site auth POSTs unless the Origin is same-origin or
      # explicitly allowlisted; the frontend proxies /api/* internally so the
      # browser Origin (:8089/:8090) must be allowlisted here.
      GATEWAY_CORS_ORIGINS: http://localhost:8089,http://localhost:8090
    volumes:
      - ./data:/data
      - ./deer-flow-config.yaml:/app/backend/config.yaml:ro
      - ./workflows:/app/workflows:ro
      - ./deer-flow-extensions-config.json:/app/deer-flow-extensions-config.json:ro
    restart: unless-stopped

  # DeerFlow Next.js web UI (the research workspace frontend).
  # The upstream deer-flow stack runs frontend(:3000) + nginx(:2026) + gateway(:8001).
  # The pacgate wrapper only shipped the gateway, so the research UI was missing.
  # NOTE: the published bytedance image bakes DEER_FLOW_INTERNAL_GATEWAY_BASE_URL
  # =http://127.0.0.1:8001 (build-time) and a newer 2.1.x login schema. This image
  # is built from the deer-flow v2.0.0 tag to match the backend (deer-flow-pacgate
  # wraps backend 2.0.0) and sets the gateway URL to deer-flow:8001.
  deer-flow-frontend:
    image: pacgate-deer-flow-frontend:0.2.0
    container_name: deer-flow-frontend
    depends_on: [deer-flow]
    ports:
      - "8090:3000"
    environment:
      DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://deer-flow:8001
      DEER_FLOW_TRUSTED_ORIGINS: http://localhost:8089,http://localhost:8090,http://localhost:3000
      BETTER_AUTH_SECRET: ${PACGATE_JWT_SECRET}
    restart: unless-stopped

  pacgate-mcp:
    build:
      context: ../pacgate-mcp
      dockerfile: Dockerfile
    image: pacgate-mcp:0.1.0
    container_name: pacgate-mcp
    depends_on: [pacgate-api]
    environment:
      PACGATE_API_URL: http://pacgate-api:8080
      PACGATE_API_EMAIL: ${PACGATE_API_EMAIL}
      PACGATE_API_PASSWORD: ${PACGATE_API_PASSWORD}
      PACGATE_JWT_TOKEN: ${PACGATE_JWT_TOKEN}
      PACGATE_MCP_PORT: "8000"
      PACGATE_MCP_TIMEOUT: "60"
    restart: unless-stopped

  openviking:
    image: ghcr.io/volcengine/openviking@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701
    container_name: openviking
    ports:
      - "1933:1933"
    volumes:
      - ./openviking:/app/.openviking
    environment:
      OPENVIKING_CONF_CONTENT: ${OPENVIKING_CONF_CONTENT}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pacgate-nginx
    depends_on: [pacgate-api, deer-flow]
    ports:
      - "8089:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pacgate-db-data: