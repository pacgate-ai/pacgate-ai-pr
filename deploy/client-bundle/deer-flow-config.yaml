# Pacgate-ai DeerFlow configuration — on-board local models (ollama.com blocked)
# Default (first) model = gemma4:12b-it-q8_0 (schema-valid structured/tool calls,
# benchmarked end-to-end). ornith-1.5:9b is listed after it as a fast fallback.
#
# IMPORTANT: the deep-research "Generate follow-up questions" step uses structured
# output (json_schema -> Ollama grammar). Some local models (e.g. ornith-1.5:9b)
# fail with "Failed to initialize samplers: failed to parse grammar" on that
# step. gemma4:12b-it-q8_0 handles the grammar reliably, so it must be the default.

models:
  - name: gemma4-12b-local
    display_name: Gemma 4 12B (Local)
    description: Local Gemma model. Default for research (schema-valid structured/tool calls).
    use: langchain_openai:ChatOpenAI
    model: gemma4:12b-it-q8_0
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  - name: ornith-1.5-9b-local
    display_name: Ornith 1.5 9B (Local)
    description: Fast non-reasoning local model. Fallback for research.
    use: langchain_openai:ChatOpenAI
    model: ornith-1.5:9b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  - name: ornith-1.5-35b-local
    display_name: Ornith 1.5 35B (Local)
    description: Heavier local model for complex research.
    use: langchain_openai:ChatOpenAI
    model: ornith-1.5:35b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  - name: nemotron-3.5-lightning-30b-local
    display_name: Nemotron 3.5 Lightning 30B (Local)
    description: Local Nemotron model, long context. Good for legal reasoning and case analysis.
    use: langchain_openai:ChatOpenAI
    model: nemotron-3.5-lightning:30b-a3b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 16384
    temperature: 0.1

  - name: qwen3.5-9b-local
    display_name: Qwen 3.5 9B (Local)
    description: Local Qwen model.
    use: langchain_openai:ChatOpenAI
    model: qwen3.5:9b-q8_0
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  # Nemotron 3.5 Lightning 30B — longest-context local model (1M context window).
  # Supports tools + thinking. Heavier (32.9B, Q4_K_M) so it is NOT the default;
  # select it in the chat model picker for long-context research runs.
  - name: nemotron-3.5-lightning-30b-local
    display_name: Nemotron 3.5 Lightning 30B (Local)
    description: Longest-context local model (1M tokens). Supports thinking + tools. Best for deep multi-step research.
    use: langchain_openai:ChatOpenAI
    model: nemotron-3.5-lightning:30b-a3b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    # Long thinking pauses on a 30B reasoning model — raise the stream chunk
    # timeout so the gateway does not drop the connection mid-thought.
    stream_chunk_timeout: 300

  # ── Cloud-routed models (via ollama.com / `ollama signin`) ────────────────
  # These tags have no weight layers on disk (size "-"); inference routes to
  # ollama.com. Auth rides the `ollama signin` OAuth session — no API key. Add
  # them as OPTIONS so users can pick local OR cloud per workload; local stays
  # default. Requires `ollama signin` on the AIPC.
  - name: deepseek-v4-flash-0731-cloud
    display_name: DeepSeek V4 Flash 0731 (Cloud)
    description: Fast cloud model for quick research iterations and high-throughput drafting.
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-flash:0731-cloud
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    stream_chunk_timeout: 120

  - name: deepseek-v4-pro-cloud
    display_name: DeepSeek V4 Pro (Cloud)
    description: Heavier cloud model for complex research and legal reasoning.
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-pro:cloud
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    stream_chunk_timeout: 120

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# Persist LangGraph thread state + thread list to SQLite. Without a
# 'checkpointer' section deer-flow falls back to InMemoryStore, so the thread
# list + admin session reset on every restart. 'connection_string' is resolved
# relative to the app base dir (.deer-flow), which is bind-mounted via
# compose.bundle.yaml: ./data/deer-flow:/app/backend/.deer-flow
checkpointer:
  type: sqlite
  connection_string: checkpoints.db

# Unified persistence for deer-flow application data (runs/thread metadata).
# Mounted via compose.bundle.yaml: ./data/deer-flow:/app/backend/.deer-flow
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

memory:
  storage_class: pacgate_deerflow_adapter.storage.PacgateMemoryStorage