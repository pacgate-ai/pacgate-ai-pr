# Pacgate-ai runtime nginx — client AIPC ingress
#
# Routes:
#   /          → pacgate-api (landing page + API)
#   /api/      → pacgate-api (metadata API, machine-to-machine)
#   /research/ → deer-flow (legal research workspace)
#
# qm (co-working workspace) runs on port 8182 via `qm up`, NOT behind this nginx.
# Access qm directly at http://localhost:8182.

server {
    listen 80;
    server_name _;

    # Landing page (served by pacgate-api)
    location / {
        proxy_pass http://pacgate-api:8080/;
    }

    # Metadata API (machine-to-machine)
    location /api/ {
        proxy_pass http://pacgate-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Workflow execution can take up to 2 minutes (multi-step LLM)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Research surface → deer-flow (proxy to the gateway, NOT a dead 302 redirect)
    # DEPLOYMENT-GUIDE §2.3: proxy to deer-flow:8001 with SSE buffering off.
    # The previous `return 302 http://localhost:8090/` pointed at a port nothing
    # serves on (only deer-flow:8001 listens), so /research/ was unreachable.
    location /research/ {
        proxy_pass http://deer-flow:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}