# Pacgate-ai DeerFlow configuration — on-board local models are the DEFAULT.
#
# EGRESS STATUS (corrected 2026-09-25): this file previously said "ollama.com
# blocked". That was FALSE as written. Nothing in this repo blocks ollama.com —
# not a hosts entry, not a firewall rule, not a proxy. Some client networks block
# it themselves (the handoff notes say "may be blocked"), which is a property of
# their network, not a control we ship. So treat `:cloud` tags as REACHABLE unless
# a given site proves otherwise: `:cloud` models DO send prompt text to ollama.com
# wherever the network allows it.
#
# What we control is the DEFAULT. Local models are default, auto-escalation is
# local (see `model_routing` below), and cloud models are reachable only when a
# user PICKES one. The firm accepts that deliberate choice; it does not accept
# egress as a side effect of prompt size, upload, or not touching the picker.
# `scripts/test-chat-no-auto-egress.ps1` enforces that distinction.
#
# Default (first) model = gemma4:12b-it-qat (schema-valid structured/tool calls,
# benchmarked end-to-end). ornith-1.5:9b is listed after it as a fast fallback.
#
# IMPORTANT: the deep-research "Generate follow-up questions" step uses structured
# output (json_schema -> Ollama grammar). Some local models (e.g. ornith-1.5:9b)
# fail with "Failed to initialize samplers: failed to parse grammar" on that
# step. gemma4:12b-it-qat handles the grammar reliably, so it must be the default.
#
# MODEL TAG CONSISTENCY: every LOCAL tag named below must also be listed in
# ollama-models.txt (the pre-pull list install.ps1 reads), or a fresh machine will
# install cleanly and then 404 on the first run with
# `model '<tag>' not found`. `:cloud` tags are exempt - they need no local weights.
# scripts/audit-model-tags.ps1 enforces this.

# Pacgate 2026-10-10 (AIPC1-ONLY fallback, pre-authorized in
# HANDOFF-PUSH-AND-REBUILD-0.1.25.md): gemma4-12b is now the DEFAULT on this
# machine. Evidence (runtime/diag1..6-*-1010): nemotron-30b is 24.05GB total
# against 16GB VRAM - 13GB in VRAM + ~11GB spilled to host RAM. With the host
# at 0.45GB free RAM the spilled pages thrash: today's Ollama log shows 13
# evictions, 18 server errors, 34 model loads and 30 slow POSTs in ~2.5h, and
# a 27-token test call queued 108s behind an 18k-token agent call (prefill on
# the spilled half ran at ~195 t/s vs ~580 t/s fully-in-VRAM). gemma4:12b
# (12GB q8_0) fits ENTIRELY in VRAM: no spill, no evictions, ~3x faster
# prefill, and host RAM recovers ~16GB. Tag choice: q8_0 (NOT qat) because
# openviking's VLM and pacgate-api's workflow tiers (.env PACGATE_MODEL_*)
# already use q8_0 on this machine - one shared runner slot, zero cross-lane
# swaps. nemotron stays in the picker as a deliberate heavy option. This
# roster change is LOCAL-ONLY (user directive 2026-09-21/10-09): do NOT
# upstream. The 2026-10-07 nemotron max_tokens cap note still applies to the
# nemotron entry below (thinking-loop guard).
#
# ── 2026-10-16 CONTEXT-CAP FIX (LOCAL-ONLY) — resolves the AIPC1 memory wall ──
# Root cause of the "every session hits the RAM wall" symptom: `gemma4:12b-it-q8_0`
# declares a 262144-token context. deer-flow calls Ollama over the OpenAI-compat
# route (`/v1/chat/completions`), and Ollama 0.40.5 auto-fits THAT route up to the
# model's full declared context — a per-request `options.num_ctx` is not honoured
# there, and the server-side `OLLAMA_CONTEXT_LENGTH` default is not applied to it
# either (both verified 2026-10-16). gemma4 uses mostly sliding-window layers
# (n_swa 1024) but 8 GLOBAL-attention layers whose KV grows linearly with context;
# at 262144 those 8 layers alone need ~2176 MiB of KV, which does not fit beside
# the 11613 MiB of weights in the 16GB card. Ollama therefore splits the runner
# across CPU+GPU ("2%/98% CPU/GPU"): ~12.4 GB of weights get CPU-mapped and ~8.5 GB
# of KV lands in host RAM, so llama-server commits ~21 GB and host free RAM sits at
# ~1 GB. That is the wall — before any container is even counted.
#
# Fix: use the DERIVED tag `gemma4-legal:12b-chat` = `FROM gemma4:12b-it-q8_0` with
# `PARAMETER num_ctx 131072`. 131072 is still >3x the 40000 auto-escalation
# threshold below, so usable context is unchanged; the runner fits 100% in VRAM.
# Recreate it with: deploy/client-bundle/ensure-context-capped-model.ps1 (see ollama-models.txt).
# Verified 2026-10-16: 100% GPU, VRAM 15567 MiB, llama-server commit 21.0 GB -> 13.0 GB,
# host free 1.2 GB -> 9.7 GB, cold load 165 s -> 20 s, vision still correct.
# NOTE: every local role below points at this SAME tag on purpose — a mixed roster
# would swap the two variants in and out of VRAM on every background call.
models:
  - name: gemma4-12b-local
    display_name: Gemma 4 12B (Local)
    description: >-
      Default on this machine (AIPC1). Context-capped derivative of
      gemma4:12b-it-q8_0: num_ctx 131072 instead of the model's declared
      262144, so the runner fits 100% in the 16GB VRAM (no CPU spill, no
      evictions, ~8 GB of host RAM reclaimed). Same weights, so structured/
      tool calls, json_schema grammar and the multimodal projector are all
      unchanged. Shares one runner slot with the internal roles below.
    use: langchain_openai:ChatOpenAI
    model: gemma4-legal:12b-chat
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    # ── 2026-10-16 REASONING-BURN FIX (LOCAL-ONLY) ──────────────────────────
    # This entry declared no thinking settings at all, which made the UI's
    # "thinking off" toggle a NO-OP for the local chat model: factory.py only
    # emits a disable directive when `has_thinking_settings` is true (i.e. the
    # entry declares `when_thinking_enabled` or `thinking`), so with neither
    # declared nothing was sent and Ollama defaulted to reasoning ON.
    # Verified on Ollama 0.40.5: reasoning_effort=none is the ONLY lever that
    # works (thinking.type=disabled and think=false are both ignored).
    # Thinking ON is unaffected: when_thinking_enabled is empty, so no directive
    # is sent and the model reasons as before.
    supports_reasoning_effort: true
    when_thinking_disabled:
      reasoning_effort: none

  - name: nemotron-3.5-lightning-30b-local
    display_name: Nemotron 3.5 Lightning 30B (Local, heavy)
    description: >-
      Most capable local MOE (1M context, thinking + tools) but 24GB total on
      a 16GB VRAM card: ~11GB spills to host RAM. On AIPC1 this caused
      eviction/reload cycling (13 evictions in 2.5h on 2026-10-10) and
      2-3min first-token latency under RAM pressure. Pick deliberately for
      1M-ctx workloads; expect slow prefill while host RAM is tight.
      max_tokens MUST stay at 8192 or below (thinking-loop guard).
    use: langchain_openai:ChatOpenAI
    model: nemotron-3.5-lightning:30b-a3b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    # Long thinking pauses on a 30B reasoning model — raise the stream chunk
    # timeout so the gateway does not drop the connection mid-thought.
    stream_chunk_timeout: 300

  # Dedicated memory-update model. Referenced by memory.model_name below.
  # Background memory updates run OUTSIDE any user-visible run, so a runaway
  # generation here hogs the single Ollama runner slot and stalls every chat
  # (observed 2026-10-07: 43k+ token loop). Memory facts are short JSON - a hard
  # 2048 cap is generous and cannot loop meaningfully.
  # Pacgate 2026-10-08 (tuning pass, LOCAL-ONLY): helper entries pinned to the
  # SAME tag as the chat default (nemotron-30b) = zero VRAM swap. gemma4 and
  # nemotron cannot coexist in 16GB VRAM (23.7GB + 6.5GB weights), so every
  # background call on gemma4 evicted the chat model and paid 9-37s reloads
  # (10 reloads in 11 min observed). The max_tokens caps keep the
  # runaway-generation protection.
  - name: gemma4-12b-memory
    display_name: "[internal] Memory updater (Gemma 12B, capped)"
    description: Internal background memory-update model. Hard 2048-token cap. Same context-capped tag as chat default - no VRAM swap. Not intended for chat; kept visible because deer-flow has no hide-from-picker flag (frontend filter = upstream-PR candidate).
    use: langchain_openai:ChatOpenAI
    model: gemma4-legal:12b-chat
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 2048
    temperature: 0.1
    # ── 2026-10-16 REASONING-BURN FIX (LOCAL-ONLY) ──────────────────────────
    # Same defect the two cloud models below were fixed for on 2026-10-09, but
    # never applied to the local roles. Verified by direct reproduction of this
    # exact call path (MemoryUpdater._get_model() -> model.invoke()):
    #   completion_tokens=2048, content="" (0 chars), finish_reason="length"
    #   -> _parse_memory_update_response raises
    #      "No valid memory update JSON object found: line 1 column 1 (char 0)"
    # The 2048 cap was consumed ENTIRELY by the model's separate `reasoning`
    # channel, so the JSON body was never emitted. 100% failure rate, ~174 s
    # burned per attempt on the single Ollama runner slot.
    #
    # Why the existing guards did not catch it: factory.py only emits a disable
    # directive when `has_thinking_settings` is true, i.e. when the entry
    # declares `when_thinking_enabled` or `thinking`. This entry declared
    # neither, so `thinking_enabled=False` from updater.py:395 was a no-op and
    # NO directive was sent — Ollama then defaulted to reasoning ON.
    #
    # Verified on Ollama 0.40.5 /v1/chat/completions (A/B/C/D, same prompt):
    #   no control            -> reasoning 1970 chars, 35 s
    #   reasoning_effort=none -> reasoning    0 chars, 10 s   <-- only working lever
    #   thinking.type=disabled-> reasoning 1945 chars, 33 s   (IGNORED)
    #   think=false           -> reasoning 1963 chars, 33 s   (IGNORED)
    # supports_reasoning_effort MUST be true or factory.py pops the key back out.
    supports_reasoning_effort: true
    when_thinking_disabled:
      reasoning_effort: none

  - name: gemma4-12b-summarizer
    display_name: "[internal] Summarizer (Gemma 12B, capped)"
    description: Internal conversation-summarization model. Hard 4096-token cap. Same context-capped tag as chat default - no VRAM swap. Not intended for chat.
    use: langchain_openai:ChatOpenAI
    model: gemma4-legal:12b-chat
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 4096
    temperature: 0.1
    # Same reasoning-burn fix as gemma4-12b-memory above (verified 2026-10-16).
    # The summarizer is the most expensive internal role (it receives ~17k real
    # tokens, see the summarization block below), so an unsuppressed reasoning
    # channel here is the single largest avoidable cost on the runner slot.
    supports_reasoning_effort: true
    when_thinking_disabled:
      reasoning_effort: none

  # Pacgate 2026-10-15: explicit pin for the title role (see the `title:` block).
  # Previously unpinned, so title fell through to models[0] - local only by
  # ordering accident. Same tag as chat default and the other internal roles, so no
  # VRAM swap. The cap matches the memory updater's; title output is a few words.
  - name: gemma4-12b-title
    display_name: "[internal] Title generator (Gemma 12B, capped)"
    description: Internal first-exchange title model. Hard 2048-token cap. Same context-capped tag as chat default - no VRAM swap. Not intended for chat.
    use: langchain_openai:ChatOpenAI
    model: gemma4-legal:12b-chat
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 2048
    temperature: 0.1
    # Same reasoning-burn fix as gemma4-12b-memory above (verified 2026-10-16).
    # Title output is a few words; a 2048 cap spent on reasoning would truncate
    # it to empty exactly like the memory updater.
    supports_reasoning_effort: true
    when_thinking_disabled:
      reasoning_effort: none

  # Pacgate 2026-10-07 (rev 2): qwen3.8:27b DEMOTED from the picker. Benchmark
  # on the 8060S iGPU (warm, ~3k ctx): dense 27B = 26 t/s gen / 225 t/s
  # ingestion, vs nemotron MOE 81/1080 and ornith MOE 64/1263. The dense model
  # is 3-5x slower on BOTH axes and strictly dominated by the two MOEs. It
  # remains pre-pulled (pacgate-api Mid workflow tier uses it - do NOT remove
  # from ollama-models.txt) but is no longer a deer-flow chat option.
  # - name: qwen3.8-27b-local
  #   display_name: Qwen 3.8 27B (Local)
  #   description: Dense local model. Slower than the MOEs (26 t/s vs 64-81).
  #   use: langchain_openai:ChatOpenAI
  #   model: qwen3.8:27b-mtp-q4_K_M
  #   api_key: ollama
  #   base_url: http://host.docker.internal:11434/v1
  #   max_tokens: 8192
  #   temperature: 0.1

  - name: ornith-1.5-9b-local
    display_name: Ornith 1.5 9B (Local)
    description: Fast non-reasoning local model. Fallback for research.
    use: langchain_openai:ChatOpenAI
    model: ornith-1.5:9b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  - name: ornith-1.5-35b-local
    display_name: Ornith 1.5 35B (Local, heavy)
    description: >-
      Heaviest local model for complex research. 35B-class capability, but 21GB
      weights exceed the 16GB VRAM budget - first use pays a 2-4min model swap
      and runs partly from CPU. Benchmark 2026-10-08: 24.3 t/s gen, 34 t/s
      prefill (vs default nemotron 30.7/30). Pick deliberately for hard
      analysis; use the default for everything else.
    use: langchain_openai:ChatOpenAI
    model: ornith-1.5:35b
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1

  # Pacgate 2026-09-21: DISABLED. The tag below is not pre-pulled by
  # ollama-models.txt and is not installed on either AIPC. Selecting it in the
  # picker produces `model '<tag>' not found` (ollama returns HTTP 404) and the
  # agent run fails outright - there is no fallback. Re-enable only after the
  # tag is added to ollama-models.txt or confirmed installed.
  # - name: qwen3.5-9b-local
  #   display_name: Qwen 3.5 9B (Local)
  #   description: Local Qwen model.
  #   use: langchain_openai:ChatOpenAI
  #   model: qwen3.5:9b-q8_0
  #   api_key: ollama
  #   base_url: http://host.docker.internal:11434/v1
  #   max_tokens: 8192
  #   temperature: 0.1

  # Gemma 4 26B — heavier local model (28GB on host) for complex reasoning
  # WITHOUT cloud egress. Not the default (slower on the 16GB dGPU); pick it
  # for long-context legal analysis that must stay fully on-device.
  # Pacgate 2026-09-21: DISABLED. ollama-models.txt deliberately does NOT
  # pre-pull the 26b weights ("heavier than AIPC NPU budget for Main"), and they
  # are not installed on either AIPC. Leaving this active put a picker entry in
  # the UI that fails with HTTP 404 when selected.
  # - name: gemma4-26b-local
  #   display_name: Gemma 4 26B (Local)
  #   description: Heavier local Gemma model (28GB). Strong reasoning, stays fully on-device. Not default (slower).
  #   use: langchain_openai:ChatOpenAI
  #   model: gemma4:26b-a4b-it-qat
  #   api_key: ollama
  #   base_url: http://host.docker.internal:11434/v1
  #   max_tokens: 8192
  #   temperature: 0.1
  #   supports_thinking: true
  #   stream_chunk_timeout: 300   <- was live by accident (attached to the
  #   ornith-35b entry above); commented out 2026-10-10 during the AIPC1
  #   fallback edit. Re-enable inside the 26b block if that entry returns.

  # ── Cloud-routed models (via ollama.com / `ollama signin`) ────────────────
  # Pacgate 2026-10-07 (rev 2, per user choice): the cloud roster is the TWO
  # FLASH models - deepseek-v4.1-flash and glm-5.3-flash - chosen for speed and
  # lower cost. The heavier tags (deepseek-v4-pro:cloud, glm-5.3:cloud) were
  # dropped from the picker; re-add a models: entry if a workload ever needs
  # them. Context for the earlier removal: the ollama.com account hit its
  # WEEKLY usage limit (account-wide, all cloud models fail identically; resets
  # weekly or needs credits at ollama.com/settings). Local stays default;
  # escalation stays local; picking cloud is always a deliberate act.
  - name: deepseek-v4.1-flash-cloud
    display_name: DeepSeek V4.1 Flash (Cloud)
    description: Fast cloud model for quick research iterations and high-throughput drafting. Requires ollama signin; subject to ollama.com weekly limits.
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4.1-flash:cloud
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    # Pacgate 2026-10-09: both cloud models burn the ENTIRE max_tokens budget
    # on invisible reasoning tokens when thinking is not suppressed (verified:
    # 8192 completion tokens -> 36K chars of reasoning, ZERO content,
    # finish_reason=length). deer-flow's lead agent runs with
    # thinking_enabled=False, but without when_thinking_disabled nothing is
    # sent to suppress the reasoning channel. Verified fix: Ollama 0.40.1's
    # OpenAI endpoint honors reasoning_effort=none (content-only, 0 reasoning
    # tokens); think:false and thinking.type=disabled are IGNORED on that
    # endpoint. Raising the cap does NOT help (16384 -> still all reasoning).
    supports_reasoning_effort: true
    when_thinking_disabled:
      reasoning_effort: none
    stream_chunk_timeout: 120

  - name: glm-5.3-flash-cloud
    display_name: GLM 5.3 Flash (Cloud)
    description: Fast cloud model for research and drafting. VLM-capable (vision) so view_image is registered. Requires ollama signin; subject to ollama.com weekly limits.
    use: langchain_openai:ChatOpenAI
    model: glm-5.3-flash:cloud
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    supports_vision: true
    # Same reasoning-burn fix as deepseek above (verified 2026-10-09).
    supports_reasoning_effort: true
    when_thinking_disabled:
      reasoning_effort: none
    stream_chunk_timeout: 120

# ── Automatic model routing: escalation stays LOCAL ─────────────────────────
# When enabled and NO explicit model is requested, deer-flow auto-picks the
# model per request. It escalates when EITHER:
#   - the conversation-history token estimate (from the run's messages)
#     >= message_token_threshold, OR
#   - the bound tool surface count >= tool_count_threshold.
#
# PACGATE 2026-09-25: `cloud_model` is now the LOCAL long-context model, NOT a
# cloud tag. This was a client-pipeline defect, not a preference.
#
# What was wrong: the escalation target was `glm-5.3-flash-cloud` at a 20,000-token
# threshold. The token signal grows with CONVERSATION HISTORY, which grows with
# uploaded-document text and tool results -- so an attorney who uploaded an
# ordinary ~30-page contract and did not touch the model picker had that contract
# sent to ollama.com, with no sanitizer, no consent and no banner. The firm's whole
# promise is that client identity does not leave the machine, so the DEFAULT had to
# stop being egress.
#
# Why the threshold is what it is: gemma4-12b (the local default) is capped at a
# 64K context, while the local long-context model has 1M. Escalating at 40,000 is
# ~62% of the small model's window, so the escalation exists for the reason it
# should -- the small model is about to overflow -- and it lands on a model that
# can actually hold the context. It is no longer a cloud trigger.
#
# Cloud models remain in `models:` and remain SELECTABLE in the picker, so
# deliberate cloud use is unaffected. The 2026-08-30 decision that the firm accepts
# prompt egress in exchange for research timelines still stands for a user who
# chooses it explicitly. Only the AUTOMATIC path changed.
model_routing:
  enabled: true
  # Pacgate 2026-10-07: nemotron is now BOTH the default and the escalation
  # target. Its 1M context makes the old gemma4-overflow escalation redundant -
  # the model that overflows at 40k tokens is no longer the one holding the
  # conversation. local_model and cloud_model point at the same entry; the
  # schema key name is unchanged (renaming would break deer-flow's config).
  # Pacgate 2026-10-10 (AIPC1 fallback): both targets = gemma4-12b-local.
  # With the default AND escalation target on the same fully-in-VRAM model,
  # escalation is a no-op by design - the point is that no automatic path can
  # pull the 24GB nemotron into VRAM behind the user's back.
  local_model: gemma4-12b-local
  # LOCAL, not cloud. Renaming this key would break deer-flow's config schema, so
  # it is still called cloud_model; read it as "the escalation target".
  cloud_model: gemma4-12b-local
  message_token_threshold: 40000
  tool_count_threshold: 200

# Pacgate 2026-10-07: pin background memory updates to a dedicated capped model.
# The memory updater runs OUTSIDE user-visible runs; without a pin it used the
# first config model with no generation cap, and a confused run looped 43k+
# tokens on the single Ollama runner slot, stalling every chat in the session.
# gemma4-12b-memory carries a hard 2048 max_tokens so this class of loop cannot
# recur. (MemoryConfig.model_name, deerflow/agents/memory/updater.py.)
memory:
  storage_class: pacgate_deerflow_adapter.storage.PacgateMemoryStorage
  # Pacgate 2026-10-10 (AIPC1 fallback): repinned to gemma4-12b-memory. With
  # gemma4-q8_0 as the chat default, a nemotron-tagged memory call would swap
  # the 24GB model into VRAM on EVERY background update - the exact failure
  # mode documented 2026-10-08 (10 reloads in 11 min), just in reverse. A
  # same-tag pin = no swap. The 2026-10-08 invalid-JSON concern is mitigated:
  # the 2048 cap still holds, and gemma4's JSON reliability is why it was the
  # memory pin originally.
  model_name: gemma4-12b-memory

# Pacgate 2026-10-15: pin the TITLE role explicitly. It was the one internal role
# with no model_name, so create_chat_model() fell through to
# `config.models[0].name` (factory.py:105-106). That made its locality an
# ORDERING ACCIDENT: it stays on-device only while `gemma4-12b-local` happens to
# be the first entry in `models:`. Reorder that block and put a `-cloud` entry
# first and the title step - which receives the FIRST USER MESSAGE, exactly like
# the summarizer - would start egressing to ollama.com with no config change and
# no picker interaction: the case the header above forbids ("egress as a side
# effect of ... not touching the picker").
#
# Same tag as the chat default and the other internal roles, so this costs no VRAM
# and introduces no swap. Title generation is bounded by
# DEERFLOW_TITLE_INVOKE_TIMEOUT_S (8s, set in compose.*.yaml), and the middleware
# already falls back to a local title on timeout.
title:
  model_name: gemma4-12b-title

# Pacgate 2026-10-09 (LOCAL-ONLY round-2 tuning, PDF-analysis thread 5d7b42df):
# summarization.enabled is upstream; the model pin + thresholds below are
# this machine's tuning. Round-2: trigger=12000 fired but per-call input
# stayed ~80k because count_tokens_approximately (chars/4) UNDERCOUNTS CJK +
# markdown ~2.7x and langchain's scaling correction is capped at 1.25x - every
# configured value is worth ~2.2-3.3x more REAL tokens. Fix: use ~2.5x smaller
# configured values so the REAL window matches intent (trigger 5000 ≈ 13-16k
# real, fires early; keep 4000 ≈ 10-13k real preserved). Context floor after
# fix: ~19.5k tools+sys + ~12k preserved + summary ≈ 33-36k.
#
# Pacgate 2026-10-15 (MEASURED, not estimated): chars/4 was only half the story.
# count_tokens_approximately undercounts this workload by **2.13x**, measured on
# AIPC1 with the real 8000-counted-token summarization prompt:
#     counted 7,981  ->  real prompt_eval_count 17,018
# So trim_tokens_to_summarize=8000 sends ~17k REAL tokens to the summarizer, not
# 8k. That is why a "capped" summary step is genuinely expensive:
#     prefill 17,018 tok @ 124 tok/s = 136.8s
#     gen      1,102 tok @   6.3 tok/s = 174.3s     -> 311.4s measured
# and at this model's own max_tokens=4096 the generation alone is ~650s, putting
# the step near ~787s. deer-flow cancels a run that yields no astream chunk for
# DEERFLOW_STREAM_IDLE_TIMEOUT_S (default 420s), and a summarization step is a
# single ainvoke inside ONE superstep, so it emits nothing for its whole
# duration. That is exactly how run ad509d43 (thread 96a4f39e) was killed at
# 16:07:56, 420s after its last chunk - AFTER it had already written
# pacgate-ai-blog.docx/.pdf at 16:00:56. The budget is now 1200s (compose).
# Keeping BOTH models pinned to the local tag is deliberate: the summarizer sees
# the entire conversation, including matter facts, so routing it to a `:cloud`
# model would be egress the user never chose - which this file forbids above
# ("it does not accept egress as a side effect of prompt size, upload, or not
# touching the picker"). Do NOT repin the summarizer to a cloud tag to make it
# faster; trim_tokens_to_summarize is the safe lever if the step must shrink.
summarization:
  enabled: true
  # Pacgate 2026-10-10 (AIPC1 fallback): same-tag repin, see memory block above.
  model_name: gemma4-12b-summarizer
  trigger:
    - type: tokens
      value: 5000
  keep:
    type: tokens
    value: 4000
  trim_tokens_to_summarize: 8000

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # Pacgate: opt in to host bash for the LocalSandboxProvider. This is the
  # documented escape hatch for fully trusted single-tenant local deployments
  # (deerflow/sandbox/security.py: is_host_bash_allowed). Without it the bash
  # tool is hard-gated off and skills that carry scripts/ cannot execute.
  allow_host_bash: true

# Pacgate: expose the sandbox file/shell tools to the agent. Without a tools:
# section get_available_tools() returns only the 2 builtins + MCP tools, so the
# agent cannot read/write files or run commands even though the sandbox exists.
# Tool names must match the @tool() names in deerflow/sandbox/tools.py.
tools:
  - name: bash
    group: sandbox
    use: deerflow.sandbox.tools:bash_tool
  - name: ls
    group: sandbox
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: sandbox
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: sandbox
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: sandbox
    use: deerflow.sandbox.tools:str_replace_tool
  - name: glob
    group: sandbox
    use: deerflow.sandbox.tools:glob_tool
  - name: grep
    group: sandbox
    use: deerflow.sandbox.tools:grep_tool

# Pacgate: auto-convert uploaded PDF/DOCX/PPTX/XLSX to Markdown on upload.
# markitdown + mammoth/openpyxl/python-pptx/pdfplumber are already installed in
# the image's venv; this flag is the only thing that was missing. AppConfig is
# extra="allow", so this section is accepted even though it has no dedicated
# schema class (uploads.py reads it via getattr with a False default).
uploads:
  auto_convert_documents: true

# Pacgate: DEFER MCP tool loading to cut system-prompt size dramatically.
# When tool_search is enabled, MCP tool schemas are NOT bound directly into the
# model's context. Instead they are listed by NAME in <available-deferred-tools>
# and the agent fetches full schemas on demand via the tool_search tool. This
# removes ~36K tokens of MCP tool-schema text from every prompt (measured: 142
# MCP tools = 144,845 chars). CRITICAL for local models (gemma4-12b) whose
# context is capped at 64K — it is the single biggest lever for prompt size.
# The sandbox tools (bash/ls/read_file/etc.) are NOT MCP tools, so they remain
# always-bound; only the MCP servers (pacgate/firecrawl/officecli/legal) defer.
tool_search:
  # PacGate 2026-10-17: RE-ENABLED. The 2026-09-12 failure was not the mechanism —
  # it was that the routing index was empty. `build_mcp_routing_middleware` returns
  # None unless a deferred tool carries routing.mode="prefer" AND non-empty keywords,
  # and no connector declared either. With an empty index nothing pre-seeds the
  # schemas a request obviously needs, so every model called an MCP tool without
  # promoting first -> "deferred, not promoted" loop, never reaching write_file.
  #
  # Both halves are now in place: the v2.1.0 routing subsystem is back-ported
  # (see the "on-demand tool routing" mounts in compose.bundle.yaml), and the
  # due-diligence connectors in deer-flow-extensions-config.json declare
  # routing.mode/keywords/priority. The keywords are the load-bearing part —
  # without them this flag reintroduces the loop.
  #
  # Rationale: 153 MCP tool schemas measured 69,313 tokens of an 80,791-token prompt
  # (~83%). Deferral replaces them with a 1,547-token names-only listing plus the
  # tool_search tool and a ~5-schema discovery payload.
  enabled: true
  auto_promote_top_k: 5  # clamp range is 1..5; 5 maximises keyword-hit breadth

# Persist LangGraph thread state + thread list to SQLite. Without a
# 'checkpointer' section deer-flow falls back to InMemoryStore, so the thread
# list + admin session reset on every restart. 'connection_string' is resolved
# relative to the app base dir (.deer-flow), which is bind-mounted via
# compose.bundle.yaml: ./data/deer-flow:/app/backend/.deer-flow
checkpointer:
  type: sqlite
  connection_string: checkpoints.db

# Unified persistence for deer-flow application data (runs/thread metadata).
# Mounted via compose.bundle.yaml: ./data/deer-flow:/app/backend/.deer-flow
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

# memory: moved above (line ~200) - merged with the model_name pin, 2026-10-07.
# Expose the custom-agent management API over HTTP (plan 021): the
# sanitizer-agent provision.ps1 needs POST/PUT /api/agents to register
# the 'sanitizer' agent. Auth still required (Better-Auth session).
agents_api:
  enabled: true

# Pacgate: close self-registration on the deer-flow frontend.
#
# At v2.0.0 /api/v1/auth/register has NO gate - it creates a 'user' account for
# anyone who can reach the URL and then sets the session cookie, auto-logging them
# in. This key mirrors upstream 2.1.0's auth.local.allow_registration (#4311) and
# is enforced by patches/deer-flow-auth.py (a bind-mount over routers/auth.py).
# Remove the patch + these two lines at the 2.1.0 upgrade; the gate becomes native.
#
# Note AppConfig declares extra="allow", so this unknown key is accepted at
# v2.0.0 - the value is read by the patch, not by upstream's schema.
auth:
  local:
    allow_registration: false

